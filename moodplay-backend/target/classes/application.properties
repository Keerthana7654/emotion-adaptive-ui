# ── Server ──
server.port=3005

# ── MySQL ──
spring.datasource.url=jdbc:mysql://localhost:3306/moodplay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Keerthana
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
# Generate a strong secret: openssl rand -base64 64
moodplay.jwt.secret=MoodPlaySuperSecretKeyForJWTSigningPleaseChangeThisInProduction2024!
moodplay.jwt.expiration=86400000

# ── Admin default credentials (change after first login) ──
moodplay.admin.username=admin
moodplay.admin.password=Moodplay@2024

# ── CORS ──
moodplay.cors.allowed-origins=http://localhost:5173

# ── Logging ──
logging.level.com.moodplay=INFO
logging.level.org.springframework.security=WARN
